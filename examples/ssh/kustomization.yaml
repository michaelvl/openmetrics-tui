# omtui-dash served over SSH, with a VictoriaMetrics sidecar that scrapes pods
# directly. Needs no Prometheus in the cluster.
#
#   make ssh-example-keys ssh-scrape-config   # once: keys and scrape.yml
#   kubectl apply -k examples/ssh
#   kubectl -n omtui port-forward svc/omtui-dash 2222:2222
#   ssh -p 2222 localhost            # picker over the dashboards
#   ssh -t -p 2222 localhost team-a  # or open one by name
#
# The Role in rbac.yaml covers the demo namespace. For all namespaces use
# rbac-cluster.yaml instead (and drop scrape.namespaces from the dashboard).
# Namespaces are set in each manifest, not here, because the Role lives in
# another namespace than the Deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  # - rbac-cluster.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  # One file per dashboard; the file name without the extension is its name.
  # No name suffix hash, so editing the ConfigMap changes what new connections
  # see (after the kubelet syncs the mount) without restarting the pod.
  - name: omtui-dashboards
    namespace: omtui
    files: [dashboards/team-a.yaml, dashboards/team-b.yaml]
    options: {disableNameSuffixHash: true}
  # Generated by `make ssh-scrape-config` from the dashboards directory.
  - name: omtui-scrape
    namespace: omtui
    files: [scrape.yml]
secretGenerator:
  # Created by `make ssh-example-keys`; never commit them. Keep the host key
  # between deployments so clients do not see a changed key.
  - name: omtui-host-key
    namespace: omtui
    files: [host_key=secrets/host_key]
  - name: omtui-authorized-keys
    namespace: omtui
    files: [authorized_keys=secrets/authorized_keys]
