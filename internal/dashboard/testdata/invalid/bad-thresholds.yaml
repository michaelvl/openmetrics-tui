title: Thresholds
panels:
  - title: A
    query: up
    thresholds:
      - { color: green }
      - { gt: 1, lt: 5, color: red }
      - { gt: 3 }
      - { gt: 4, color: red, symbol: "ab" }
      - { gt: 5, color: red, symbol: "🔴" }
